<style>
:root{--nav:#062f53;--nav2:#0b4774;--bg:#f3f6f9;--card:#fff;--ink:#17324a;--muted:#6c7d8c;--line:#dce5ec;--soft:#eaf2f8;--ok:#1c6b50;--warn:#8a6211;--bad:#9d3131}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#062f53,#0b4774)}.login-card{width:min(430px,92vw);background:white;border-radius:20px;padding:34px;box-shadow:0 25px 70px #001b2f66}.brand{font-weight:900;letter-spacing:.8px;color:var(--nav);font-size:23px}.brand small{display:block;font-size:10px;letter-spacing:2px;color:#6c7d8c;margin-top:4px}.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}.field label{font-size:10px;font-weight:900;letter-spacing:.7px;color:#607486}.field input,.field select,.field textarea{border:1px solid #cfdbe5;border-radius:9px;padding:11px;background:#fff;min-width:0}.field textarea{min-height:88px;resize:vertical}.btn{border:0;border-radius:9px;padding:11px 14px;background:var(--nav);color:white;font-weight:900;font-size:11px;cursor:pointer}.btn.alt{background:white;color:var(--nav);border:1px solid #b9cad7}.btn.bad{background:var(--bad)}.btn:disabled{opacity:.5;cursor:not-allowed}.msg{font-size:12px;margin-top:12px;color:var(--bad)}#app{display:none;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:255px;background:var(--nav);color:white;padding:22px 14px;overflow:auto}.side .logo{padding:4px 10px 22px;font-size:20px;font-weight:900}.side .logo small{display:block;font-size:9px;letter-spacing:1.7px;opacity:.7;margin-top:5px}.navbtn{width:100%;text-align:left;border:0;background:transparent;color:#dce9f3;padding:11px 12px;border-radius:8px;margin:2px 0;cursor:pointer;font-weight:800;font-size:11px}.navbtn:hover,.navbtn.active{background:#ffffff18;color:white}.side-bottom{border-top:1px solid #ffffff20;margin-top:18px;padding-top:15px}.main{margin-left:255px;min-height:100vh}.top{height:74px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.top h1{font-size:17px;margin:0}.top small{color:var(--muted)}.content{padding:24px;max-width:1600px;margin:auto}.hero{background:linear-gradient(120deg,#062f53,#0c507f);color:white;border-radius:15px;padding:24px;margin-bottom:18px}.hero h2{margin:4px 0 7px;font-size:25px}.hero p{margin:0;opacity:.85}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}.kpi,.card{background:white;border:1px solid var(--line);border-radius:12px;padding:17px}.kpi b{font-size:25px;display:block;color:var(--nav)}.kpi span{font-size:9px;font-weight:900;letter-spacing:.7px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card h3{margin:0 0 13px;color:var(--nav);font-size:14px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px;gap:12px}.section-title h2{margin:0;font-size:21px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:9px 10px;border:1px solid #cfdbe5;border-radius:8px;background:white}.tablewrap{background:white;border:1px solid var(--line);border-radius:12px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:800px}.table th{font-size:9px;letter-spacing:.6px;text-align:left;color:#6d7e8d;background:#f7f9fb;padding:11px;border-bottom:1px solid var(--line)}.table td{font-size:12px;padding:11px;border-bottom:1px solid #edf1f4;vertical-align:middle}.tag{display:inline-block;padding:5px 8px;border-radius:20px;background:var(--soft);color:var(--nav);font-size:9px;font-weight:900}.empty{padding:28px;text-align:center;color:var(--muted);background:white;border:1px dashed #cbd7e0;border-radius:12px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 14px}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#00192b99;z-index:20;display:none;align-items:flex-start;justify-content:center;padding:35px 16px;overflow:auto}.modal.open{display:flex}.modalbox{width:min(1050px,100%);background:var(--bg);border-radius:16px;overflow:hidden;box-shadow:0 20px 70px #00152366}.modalhead{background:white;border-bottom:1px solid var(--line);padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.modalbody{padding:18px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid #cbd8e2;background:white;color:var(--nav);padding:8px 10px;border-radius:8px;font-size:10px;font-weight:900;cursor:pointer}.tab.active{background:var(--nav);color:white}.pane{display:none}.pane.active{display:block}.notice{padding:12px;border-radius:9px;background:#fff8e7;border:1px solid #ecd7a6;color:#755619;font-size:12px;margin:10px 0}.ok{background:#eaf7f2;border-color:#b8decf;color:#235f4b}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{background:white;border:1px solid var(--line);border-radius:10px;padding:16px;text-align:left;color:var(--nav);font-weight:900;cursor:pointer}.muted{color:var(--muted);font-size:11px}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:1000px){.side{width:205px}.main{margin-left:205px}.kpis{grid-template-columns:repeat(2,1fr)}.grid,.split{grid-template-columns:1fr}}@media(max-width:720px){.side{position:static;width:auto}.main{margin:0}.top{position:static}.kpis{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.quick{grid-template-columns:1fr}}
</style></head><body>
<div id="login" class="login"><div class="login-card"><div class="brand">MAX INNOVA<small>ADMON · CONTROL GENERAL</small></div><p class="muted">Acceso exclusivo para administración autorizada.</p><div class="field"><label>USUARIO</label><input id="username" autocomplete="username" placeholder="ADMON"></div><div class="field"><label>CONTRASEÑA</label><input id="password" type="password"></div><button class="btn" style="width:100%" onclick="login()">INICIAR SESIÓN</button><div id="loginMsg" class="msg"></div></div></div>
<div id="app"><aside class="side"><div class="logo">MAX INNOVA<small>ADMINISTRACIÓN GENERAL</small></div><div id="nav"></div><div class="side-bottom"><button class="navbtn" onclick="refreshCurrent()">↻ ACTUALIZAR</button><button class="navbtn" onclick="logout()">⎋ CERRAR SESIÓN</button></div></aside><main class="main"><header class="top"><div><h1 id="pageTitle">Centro de control</h1><small id="pageSub">Administración integral</small></div><div style="text-align:right"><b id="adminName">ADMON</b><br><small id="adminEmail"></small></div></header><section id="content" class="content"></section></main></div>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><b id="modalTitle">EXPEDIENTE</b><button class="btn alt" onclick="closeModal()">CERRAR ×</button></div><div id="modalBody" class="modalbody"></div></div></div>
<script>
const SUPABASE_URL='https://yabqhpxpeizgfotenebl.supabase.co';const SUPABASE_KEY='sb_publishable_ks62KAcuW3LWThoUIUixNw_8ZAthlRG';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(Number(v||0));const date=v=>v?new Date(v).toLocaleString('es-MX'):'—';
let current='inicio', profile=null;
const modules=[['inicio','⌂','INICIO'],['solicitudes','▦','SOLICITUDES'],['nueva','＋','NUEVA SOLICITUD'],['web','◎','CONTACTOS / CITAS WEB'],['clientes','◉','CLIENTES Y EXPEDIENTES'],['asignaciones','⇄','ASIGNACIONES'],['cotizaciones','▤','COTIZACIONES'],['operaciones','◆','OPERACIONES'],['pagos','$','PAGOS Y RECIBOS'],['documentos','▣','DOCUMENTOS'],['citas','◷','CITAS Y AGENDA'],['seguimientos','✓','SEGUIMIENTOS'],['estados','≡','ESTADOS DE CUENTA'],['usuarios','♙','ASESORES Y USUARIOS'],['bitacora','⌁','AUDITORÍA'],['reportes','↗','REPORTES']];
function renderNav(){nav.innerHTML=modules.map(x=>`<button class="navbtn ${current===x[0]?'active':''}" onclick="view('${x[0]}')">${x[1]} &nbsp; ${x[2]}</button>`).join('')}
async function login(){
  const msg=document.getElementById('loginMsg'), btn=document.querySelector('#login .btn');
  msg.textContent='Validando acceso…'; btn.disabled=true;
  try{
    const u=String(document.getElementById('username').value||'').trim().toUpperCase().replace(/\s+/g,'');
    const pw=document.getElementById('password').value;
    if(!u||!pw){msg.textContent='Capture usuario y contraseña.';return}
    const technicalEmail=u==='ADMON'?'admonportal@maxinnova.mx':u.toLowerCase()+'@acceso.maxinnova.mx';
    const authPromise=db.auth.signInWithPassword({email:technicalEmail,password:pw});
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('La conexión con Supabase tardó demasiado. Intente nuevamente.')),15000));
    const {data,error}=await Promise.race([authPromise,timeout]);
    if(error){msg.textContent='No fue posible iniciar sesión: '+error.message;return}
    const ok=await authorize(data.user);
    if(!ok){await db.auth.signOut();msg.textContent='La contraseña fue aceptada, pero esta cuenta no tiene permiso ADMIN activo.';return}
    msg.textContent='';
    showApp();
  }catch(e){msg.textContent='Error de acceso: '+(e?.message||e)}
  finally{btn.disabled=false}
}
async function authorize(user){
  if(!user)return false;
  const {data:allowed,error:rpcError}=await db.rpc('max_innova_es_admin');
  if(rpcError||allowed!==true)return false;
  const {data:p}=await db.from('max_innova_usuarios').select('*').eq('id',user.id).maybeSingle();
  profile=p||{id:user.id,usuario:'ADMON',nombre:'Administrador MAX INNOVA',rol:'ADMIN',activo:true};
  return true;
}
async function boot(){
  try{
    const {data}=await db.auth.getSession();
    if(data.session&&await authorize(data.session.user)){showApp();return}
  }catch(e){}
  document.getElementById('login').style.display='grid';
  document.getElementById('app').style.display='none';
}
function showApp(){const loginEl=document.getElementById('login'),appEl=document.getElementById('app'),nameEl=document.getElementById('adminName'),emailEl=document.getElementById('adminEmail');if(loginEl)loginEl.style.display='none';if(appEl)appEl.style.display='block';if(nameEl)nameEl.textContent=profile?.nombre||'Administrador';db.auth.getUser().then(x=>{if(emailEl)emailEl.textContent=x.data.user?.email||''});renderNav();view('inicio')}
async function logout(){await db.auth.signOut();location.reload()}
function setHead(t,s){pageTitle.textContent=t;pageSub.textContent=s||''}function loading(){content.innerHTML='<div class="empty">Cargando información…</div>'}function err(e){content.innerHTML=`<div class="notice">${esc(e?.message||e)}</div>`}
async function safe(table,sel='*',opts={}){let q=db.from(table).select(sel);if(opts.order)q=q.order(opts.order,{ascending:opts.asc??false});if(opts.limit)q=q.limit(opts.limit);const r=await q;return r}
async function count(table){const r=await db.from(table).select('*',{count:'exact',head:true});return r.error?0:(r.count||0)}
async function view(v){current=v;renderNav();loading();try{if(v==='inicio')return dashboard();if(v==='solicitudes')return applications();if(v==='nueva')return newApplication();if(v==='web')return webRequests();if(v==='clientes')return clients();if(v==='asignaciones')return assignments();if(v==='cotizaciones')return generic('max_innova_cotizaciones','COTIZACIONES',['numero_cotizacion','folio_cotizacion','cliente_nombre','marca','modelo','monto_financiado','estatus','created_at']);if(v==='operaciones')return generic('max_innova_operaciones','OPERACIONES',['folio','monto_financiado','plazo_meses','mensualidad','saldo_actual','etapa_compra','created_at']);if(v==='pagos')return payments();if(v==='documentos')return documents();if(v==='citas')return appointments();if(v==='seguimientos')return tasks();if(v==='estados')return accountStatements();if(v==='usuarios')return users();if(v==='bitacora')return generic('max_innova_bitacora','AUDITORÍA',['folio','accion','usuario_email','detalle','created_at']);if(v==='reportes')return reports()}catch(e){err(e)}}
function refreshCurrent(){view(current)}
async function dashboard(){setHead('Centro de control','Vista general de MAX INNOVA');const [sol,cli,exp,cot,op,pay,usr,task]=await Promise.all(['max_innova_solicitudes','max_innova_clientes_asesor','max_innova_expedientes_asesor','max_innova_cotizaciones','max_innova_operaciones','max_innova_pagos','max_innova_usuarios','max_innova_tareas_asesor'].map(count));content.innerHTML=`<div class="hero"><small>ADMON · CONTROL GENERAL</small><h2>Administración integral</h2><p>Clientes, expedientes, asesores, cotizaciones, operaciones, pagos, citas y seguimiento desde un solo panel.</p></div><div class="kpis"><div class="kpi"><b>${sol}</b><span>SOLICITUDES</span></div><div class="kpi"><b>${cli}</b><span>CLIENTES / PROSPECTOS</span></div><div class="kpi"><b>${cot}</b><span>COTIZACIONES</span></div><div class="kpi"><b>${op}</b><span>OPERACIONES</span></div><div class="kpi"><b>${pay}</b><span>PAGOS</span></div></div><div class="grid"><div class="card"><h3>CONTROL OPERATIVO</h3><div class="quick"><button onclick="view('nueva')">NUEVA SOLICITUD<br><span class="muted">Registrar cliente externo</span></button><button onclick="view('solicitudes')">SOLICITUDES<br><span class="muted">Web + administración</span></button><button onclick="view('web')">CONTACTOS / CITAS<br><span class="muted">Revisar entradas web</span></button><button onclick="view('asignaciones')">ASIGNAR CLIENTES<br><span class="muted">${exp} expedientes</span></button><button onclick="view('pagos')">VALIDAR PAGOS<br><span class="muted">Control financiero</span></button><button onclick="view('citas')">AGENDA<br><span class="muted">Citas y seguimiento</span></button><button onclick="view('usuarios')">ASESORES<br><span class="muted">${usr} usuarios</span></button><button onclick="view('seguimientos')">TAREAS<br><span class="muted">${task} registros</span></button></div></div><div class="card"><h3>SEGURIDAD Y CONTROL</h3><p>La sesión se valida contra <b>Supabase Auth</b> y además exige rol <b>ADMIN</b> activo en el registro interno.</p><div class="notice ok">No se utiliza ninguna contraseña maestra ni clave service_role dentro de esta página.</div><p class="muted">Los módulos que dependan de tablas todavía no creadas mostrarán el error real de Supabase sin inventar información.</p></div></div>`}
function tableHtml(rows,fields,action){if(!rows?.length)return '<div class="empty">Sin registros.</div>';return `<div class="tablewrap"><table class="table"><thead><tr>${fields.map(f=>`<th>${f.replaceAll('_',' ').toUpperCase()}</th>`).join('')}${action?'<th>ACCIÓN</th>':''}</tr></thead><tbody>${rows.map(x=>`<tr>${fields.map(f=>`<td>${['monto','saldo','mensualidad','precio','aportacion'].some(k=>f.includes(k))?money(x[f]):esc(x[f]??'—')}</td>`).join('')}${action?`<td>${action(x)}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
async function generic(table,title,fields){setHead(title,'Consulta administrativa');const r=await safe(table,'*',{order:fields.includes('created_at')?'created_at':undefined,limit:500});if(r.error)return err(r.error);content.innerHTML=`<div class="section-title"><h2>${title}</h2><div class="toolbar"><button class="btn alt" onclick="refreshCurrent()">ACTUALIZAR</button></div></div>${tableHtml(r.data,fields)}`}

async function audit(folio,accion,detalle){try{const u=(await db.auth.getUser()).data.user;await db.from('max_innova_bitacora').insert({folio:folio||null,accion,detalle,usuario_id:u?.id||null,usuario_email:u?.email||null})}catch(e){console.warn('Bitácora:',e)}}
function makeFolio(){const d=new Date(),ymd=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;return `MAX-${ymd}-${Math.random().toString(36).slice(2,7).toUpperCase()}`}
async function applications(){setHead('Solicitudes','Solicitudes de crédito registradas en MAX INNOVA');const r=await db.from('max_innova_solicitudes').select('*').order('fecha_solicitud',{ascending:false}).limit(500);if(r.error){const r2=await db.from('max_innova_solicitudes').select('*').limit(500);if(r2.error)return err(r2.error);window._apps=r2.data||[]}else window._apps=r.data||[];content.innerHTML=`<div class="section-title"><h2>SOLICITUDES</h2><div class="toolbar"><input id="appSearch" placeholder="Buscar folio, nombre, RFC o teléfono" oninput="filterApps()"><button class="btn" onclick="view('nueva')">+ NUEVA SOLICITUD</button></div></div><div id="appTable"></div>`;filterApps()}
function filterApps(){let q=String(appSearch.value||'').toLowerCase(),a=(window._apps||[]).filter(x=>!q||`${x.folio} ${x.nombre} ${x.rfc} ${x.telefono} ${x.correo}`.toLowerCase().includes(q));appTable.innerHTML=tableHtml(a,['folio','nombre','telefono','rfc','tipo_financiamiento','estatus','origen'],x=>`<button class="btn alt" onclick="openApplication('${x.id}')">ABRIR</button>`)}
function openApplication(id){const x=(window._apps||[]).find(a=>String(a.id)===String(id));if(!x)return;const statuses=['SOLICITUD RECIBIDA','DOCUMENTACIÓN PENDIENTE','DOCUMENTACIÓN RECIBIDA','EN REVISIÓN','EN EVALUACIÓN','INFORMACIÓN ADICIONAL REQUERIDA','PREAUTORIZADA','AUTORIZADA','NO AUTORIZADA','EN FORMALIZACIÓN','FORMALIZADA','CANCELADA'];openModal('EXPEDIENTE DE SOLICITUD · '+(x.folio||''),`<div class="grid"><div class="card"><h3>SOLICITANTE</h3><div class="formgrid"><div class="field full"><label>NOMBRE</label><input id="saName" value="${esc(x.nombre||'')}"></div><div class="field"><label>TELÉFONO</label><input id="saPhone" value="${esc(x.telefono||'')}"></div><div class="field"><label>CORREO</label><input id="saMail" value="${esc(x.correo||'')}"></div><div class="field"><label>RFC</label><input id="saRfc" value="${esc(x.rfc||'')}"></div><div class="field"><label>CIUDAD</label><input id="saCity" value="${esc(x.ciudad||'')}"></div></div></div><div class="card"><h3>SEGUIMIENTO QUE VE EL CLIENTE</h3><div class="field"><label>ESTATUS</label><select id="saStatus">${statuses.map(z=>`<option ${z===x.estatus?'selected':''}>${z}</option>`).join('')}</select></div><div class="field"><label>INDICACIONES PARA EL CLIENTE</label><textarea id="saInstructions">${esc(x.indicaciones_cliente||'')}</textarea></div><p class="muted">Al guardar, este estatus e indicaciones quedan en la misma solicitud que consulta el cliente con su folio.</p></div></div><div class="card" style="margin-top:12px"><h3>INFORMACIÓN INTERNA / PROYECTO</h3><textarea id="saProject">${esc(x.proyecto||'')}</textarea></div><div class="toolbar" style="margin-top:14px"><button class="btn" onclick="saveApplicationAdmin('${x.id}','${esc(x.folio||'')}')">GUARDAR CAMBIOS</button><button class="btn alt" onclick="createClientFromApplication('${x.id}')">CREAR / VINCULAR CLIENTE</button><button class="btn alt" onclick="view('documentos');closeModal()">DOCUMENTOS</button><button class="btn alt" onclick="view('operaciones');closeModal()">OPERACIÓN</button></div>`)}
async function saveApplicationAdmin(id,folio){const row={nombre:saName.value.trim(),telefono:saPhone.value.trim(),correo:saMail.value.trim()||null,rfc:saRfc.value.trim().toUpperCase()||null,ciudad:saCity.value.trim()||'',estatus:saStatus.value,indicaciones_cliente:saInstructions.value.trim(),proyecto:saProject.value.trim()};const r=await db.from('max_innova_solicitudes').update(row).eq('id',id);if(r.error)return alert(r.error.message);await audit(folio,'SOLICITUD ACTUALIZADA','Estatus: '+row.estatus);alert('Solicitud actualizada. El cliente verá el nuevo estatus al consultar su folio.');closeModal();applications()}
async function createClientFromApplication(id){const x=(window._apps||[]).find(a=>String(a.id)===String(id));if(!x)return;const u=await db.from('max_innova_usuarios').select('id,nombre,rol').eq('activo',true).in('rol',['ASESOR','ADMIN']).order('nombre');if(u.error)return alert(u.error.message);openModal('CREAR / VINCULAR CLIENTE · '+x.folio,`<div class="card"><p><b>${esc(x.nombre)}</b><br>${esc(x.telefono||'')} · ${esc(x.rfc||'')}</p><div class="field"><label>ASESOR RESPONSABLE</label><select id="scaAdvisor"><option value="">SELECCIONE</option>${(u.data||[]).map(a=>`<option value="${a.id}">${esc(a.nombre)} · ${a.rol}</option>`).join('')}</select></div><button class="btn" onclick="saveClientFromApplication('${id}')">CREAR CLIENTE Y EXPEDIENTE</button></div>`)}
async function saveClientFromApplication(id){const x=(window._apps||[]).find(a=>String(a.id)===String(id)),aid=scaAdvisor.value;if(!x||!aid)return alert('Seleccione un asesor.');let existing=await db.from('max_innova_clientes_asesor').select('id,folio_cliente').eq('folio_cliente',x.folio).maybeSingle();if(existing.data){alert('Este folio ya está vinculado a un cliente.');return}const r=await db.from('max_innova_clientes_asesor').insert({asesor_id:aid,folio_cliente:x.folio,nombre:x.nombre,telefono:x.telefono,correo:x.correo||null,rfc:x.rfc||null,ciudad:x.ciudad||null,origen:x.origen||'ADMON',estatus:'PROSPECTO'});if(r.error)return alert(r.error.message);await audit(x.folio,'CLIENTE CREADO','Cliente/expediente creado desde solicitud');alert('Cliente y expediente creados.');closeModal();clients()}
function newApplication(){setHead('Nueva solicitud','Captura administrativa con el mismo registro principal de la página pública');content.innerHTML=`<div class="card"><h3>REGISTRAR SOLICITUD</h3><p class="muted">Para solicitudes recibidas por WhatsApp, teléfono, sucursal, asesor u otro canal.</p><div class="formgrid"><div class="field full"><label>NOMBRE COMPLETO *</label><input id="anName"></div><div class="field"><label>TELÉFONO *</label><input id="anPhone"></div><div class="field"><label>CORREO</label><input id="anMail" type="email"></div><div class="field"><label>RFC *</label><input id="anRfc"></div><div class="field"><label>CIUDAD</label><input id="anCity"></div><div class="field"><label>TIPO DE FINANCIAMIENTO</label><select id="anType"><option>Vehicular</option><option>Patrimonial / Vivienda</option><option>Personal</option><option>Negocio / PyME</option><option>Empresarial</option><option>Movilidad / Plataformas</option></select></div><div class="field"><label>ORIGEN</label><select id="anOrigin"><option>ADMON</option><option>WHATSAPP</option><option>TELÉFONO</option><option>SUCURSAL</option><option>ASESOR</option><option>CORREO</option><option>OTRO</option></select></div><div class="field"><label>MODALIDAD DE DOCUMENTOS</label><select id="anDocs"><option>POR DEFINIR</option><option>ENVÍO DIGITAL</option><option>ENTREGA POSTERIOR</option></select></div><div class="field full"><label>PROYECTO / NOTAS</label><textarea id="anProject"></textarea></div></div><button class="btn" onclick="saveApplication()">REGISTRAR Y GENERAR FOLIO</button> <button class="btn alt" onclick="view('solicitudes')">CANCELAR</button><div id="anMsg" class="msg"></div></div>`}
async function saveApplication(){const name=anName.value.trim(),phone=anPhone.value.trim(),rfc=anRfc.value.trim().toUpperCase();if(!name||!phone||!rfc){anMsg.textContent='Nombre, teléfono y RFC son obligatorios.';return}anMsg.textContent='Registrando…';const dup=await db.from('max_innova_solicitudes').select('folio,nombre,estatus').eq('rfc',rfc).limit(1);if(dup.data?.length&&!confirm(`Ya existe una solicitud para este RFC.\nFolio: ${dup.data[0].folio}\n¿Desea registrar otra solicitud?`)){anMsg.textContent='Registro cancelado.';return}const folio=makeFolio(),row={folio,nombre:name,telefono:phone,correo:anMail.value.trim()||null,rfc,tipo_financiamiento:anType.value,ciudad:anCity.value.trim()||'',proyecto:anProject.value.trim(),modalidad_documentos:anDocs.value,estatus:'SOLICITUD RECIBIDA',indicaciones_cliente:'Solicitud registrada correctamente.',origen:anOrigin.value};const r=await db.from('max_innova_solicitudes').insert(row);if(r.error){anMsg.textContent=r.error.message;return}anMsg.style.color='#1c6b50';anMsg.textContent='Solicitud registrada. Folio: '+folio;setTimeout(()=>view('solicitudes'),800)}

async function webRequests(){setHead('Solicitudes web','Contactos y citas recibidos desde el sitio');const r=await safe('max_innova_solicitudes_contacto','*',{order:'created_at',limit:500});if(r.error)return err(r.error);const rows=r.data||[];content.innerHTML=`<div class="section-title"><h2>SOLICITUDES WEB</h2><div class="toolbar"><select id="webFilter" onchange="filterWeb()"><option value="">TODAS</option><option>CONTACTO</option><option>CITA</option></select><input id="webSearch" placeholder="Buscar nombre o teléfono" oninput="filterWeb()"></div></div><div id="webTable"></div>`;window._web=rows;filterWeb()}
function filterWeb(){let a=window._web||[],f=webFilter.value,q=webSearch.value.toLowerCase();a=a.filter(x=>(!f||x.tipo===f)&&(!q||`${x.nombre} ${x.telefono} ${x.correo}`.toLowerCase().includes(q)));webTable.innerHTML=tableHtml(a,['tipo','nombre','telefono','correo','ciudad','fecha_preferida','estatus','created_at'],x=>`<button class="btn alt" onclick="editWeb('${x.id}')">GESTIONAR</button>`)}
async function editWeb(id){const x=(window._web||[]).find(a=>a.id===id);if(!x)return;openModal('GESTIONAR SOLICITUD WEB',`<div class="card"><h3>${esc(x.nombre)}</h3><p>${esc(x.telefono)} · ${esc(x.correo||'')}</p><p>${esc(x.comentario||'')}</p><div class="formgrid"><div class="field"><label>ESTATUS</label><select id="weStatus">${['PENDIENTE','POR CONTACTAR','CONTACTADO','EN SEGUIMIENTO','ATENDIDO','SIN RESPUESTA','NO INTERESADO','POR CONFIRMAR','CITA CONFIRMADA','REPROGRAMADA','CANCELADO'].map(s=>`<option ${s===x.estatus?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>ASESOR PARA CONVERTIR EN CLIENTE</label><select id="weAdvisor"><option value="">SIN ASIGNAR</option></select></div><div class="full"><button class="btn" onclick="saveWeb('${id}')">GUARDAR ESTATUS</button> <button class="btn alt" onclick="convertWeb('${id}')">CREAR CLIENTE / EXPEDIENTE</button></div></div></div>`);fillAdvisors('weAdvisor')}
async function saveWeb(id){const {error}=await db.from('max_innova_solicitudes_contacto').update({estatus:weStatus.value,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);closeModal();webRequests()}
async function convertWeb(id){const x=(window._web||[]).find(a=>a.id===id),aid=weAdvisor.value;if(!aid)return alert('Seleccione un asesor.');const payload={asesor_id:aid,nombre:x.nombre,telefono:x.telefono,correo:x.correo||null,ciudad:x.ciudad||null,origen:'SITIO WEB',estatus:'PROSPECTO'};const r=await db.from('max_innova_clientes_asesor').insert(payload);if(r.error)return alert(r.error.message);await db.from('max_innova_solicitudes_contacto').update({estatus:'ATENDIDO',updated_at:new Date().toISOString()}).eq('id',id);closeModal();alert('Cliente creado y expediente generado automáticamente.');webRequests()}
async function clients(){setHead('Clientes y expedientes','Expediente maestro comercial');const r=await db.from('max_innova_clientes_asesor').select('*,max_innova_expedientes_asesor(*)').order('updated_at',{ascending:false}).limit(500);if(r.error)return err(r.error);window._clients=r.data||[];content.innerHTML=`<div class="section-title"><h2>CLIENTES Y EXPEDIENTES</h2><div class="toolbar"><input id="clientSearch" placeholder="Buscar cliente, teléfono, RFC" oninput="filterClients()"><button class="btn" onclick="newClient()">+ NUEVO CLIENTE</button></div></div><div id="clientTable"></div>`;filterClients()}

function newClient(){openModal('NUEVO CLIENTE',`<div class="card"><div class="formgrid"><div class="field full"><label>NOMBRE</label><input id="ncName"></div><div class="field"><label>TELÉFONO</label><input id="ncPhone"></div><div class="field"><label>CORREO</label><input id="ncEmail"></div><div class="field"><label>RFC</label><input id="ncRfc"></div><div class="field"><label>CURP</label><input id="ncCurp"></div><div class="field"><label>CIUDAD</label><input id="ncCity"></div><div class="field"><label>ASESOR</label><select id="ncAdvisor"></select></div><div class="full"><button class="btn" onclick="saveNewClient()">CREAR CLIENTE Y EXPEDIENTE</button></div></div></div>`);fillAdvisors('ncAdvisor')}
async function saveNewClient(){if(!ncName.value.trim()||!ncPhone.value.trim()||!ncAdvisor.value)return alert('Nombre, teléfono y asesor son obligatorios.');const r=await db.from('max_innova_clientes_asesor').insert({asesor_id:ncAdvisor.value,nombre:ncName.value.trim(),telefono:ncPhone.value.trim(),correo:ncEmail.value.trim()||null,rfc:ncRfc.value.trim().toUpperCase()||null,curp:ncCurp.value.trim().toUpperCase()||null,ciudad:ncCity.value.trim()||null,origen:'ADMON',estatus:'PROSPECTO'});if(r.error)return alert(r.error.message);closeModal();clients()}
async function openClient(id){const c=(window._clients||[]).find(x=>x.id===id);if(!c)return;const ex=Array.isArray(c.max_innova_expedientes_asesor)?c.max_innova_expedientes_asesor[0]:c.max_innova_expedientes_asesor;const [notes,tasks,quotes,docs]=await Promise.all([db.from('max_innova_notas_asesor').select('*').eq('expediente_id',ex?.id||'00000000-0000-0000-0000-000000000000').order('created_at',{ascending:false}),db.from('max_innova_tareas_asesor').select('*').eq('expediente_id',ex?.id||'00000000-0000-0000-0000-000000000000').order('created_at',{ascending:false}),db.from('max_innova_cotizaciones').select('*').eq('cliente_id',id).order('created_at',{ascending:false}),db.from('max_innova_documentos_asesor').select('*').eq('expediente_id',ex?.id||'00000000-0000-0000-0000-000000000000').order('created_at',{ascending:false})]);openModal('EXPEDIENTE · '+c.nombre,`<div class="tabs">${['resumen','seguimiento','cotizaciones','documentos'].map((x,i)=>`<button class="tab ${i?'':'active'}" onclick="tab('${x}',this)">${x.toUpperCase()}</button>`).join('')}</div><div class="pane active" data-pane="resumen"><div class="grid"><div class="card"><h3>CLIENTE</h3><p><b>${esc(c.nombre)}</b><br>${esc(c.telefono)}<br>${esc(c.correo||'')}<br>${esc(c.rfc||'')}</p></div><div class="card"><h3>EXPEDIENTE</h3><p>${esc(ex?.numero_expediente||'—')}<br>Etapa: ${esc(ex?.etapa||'—')}<br>Prioridad: ${esc(ex?.prioridad||'—')}</p><button class="btn alt" onclick="reassign('${c.id}','${ex?.id||''}')">REASIGNAR ASESOR</button></div></div></div><div class="pane" data-pane="seguimiento"><div class="card"><h3>NOTAS</h3>${(notes.data||[]).map(n=>`<p><b>${date(n.created_at)}</b><br>${esc(n.nota)}</p>`).join('')||'<p class="muted">Sin notas.</p>'}</div><div class="card" style="margin-top:12px"><h3>TAREAS</h3>${tableHtml(tasks.data||[],['titulo','vence_en','prioridad','estatus'])}</div></div><div class="pane" data-pane="cotizaciones">${tableHtml(quotes.data||[],['numero_cotizacion','folio_cotizacion','marca','modelo','monto_financiado','plazo_meses','estatus','created_at'])}</div><div class="pane" data-pane="documentos">${tableHtml(docs.data||[],['categoria','nombre_archivo','mime_type','created_at'])}</div>`)}
function tab(k,b){document.querySelectorAll('[data-pane]').forEach(x=>x.classList.toggle('active',x.dataset.pane===k));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
async function assignments(){setHead('Asignaciones','Distribución de clientes por asesor');const [c,u]=await Promise.all([db.from('max_innova_clientes_asesor').select('*').order('updated_at',{ascending:false}),db.from('max_innova_usuarios').select('*').eq('activo',true).in('rol',['ASESOR','ADMIN']).order('nombre')]);if(c.error)return err(c.error);window._advisors=u.data||[];const map=Object.fromEntries((u.data||[]).map(x=>[x.id,x.nombre]));content.innerHTML=`<div class="section-title"><h2>ASIGNACIONES</h2><span class="muted">Cambiar asesor conserva el cliente y expediente.</span></div>${tableHtml(c.data,['folio_cliente','nombre','telefono','estatus'],x=>`<span class="tag">${esc(map[x.asesor_id]||'SIN IDENTIFICAR')}</span> <button class="btn alt" onclick="reassign('${x.id}','')">CAMBIAR</button>`)}`}
async function reassign(cid,eid){if(!window._advisors){const r=await db.from('max_innova_usuarios').select('*').eq('activo',true).in('rol',['ASESOR','ADMIN']).order('nombre');window._advisors=r.data||[]}openModal('REASIGNAR CLIENTE',`<div class="card"><div class="field"><label>NUEVO ASESOR</label><select id="raAdvisor">${window._advisors.map(a=>`<option value="${a.id}">${esc(a.nombre)}</option>`).join('')}</select></div><button class="btn" onclick="saveReassign('${cid}','${eid}')">CONFIRMAR REASIGNACIÓN</button></div>`)}
async function saveReassign(cid,eid){const aid=raAdvisor.value;const r=await db.from('max_innova_clientes_asesor').update({asesor_id:aid,updated_at:new Date().toISOString()}).eq('id',cid);if(r.error)return alert(r.error.message);let q=db.from('max_innova_expedientes_asesor').update({asesor_id:aid,updated_at:new Date().toISOString()});q=eid?q.eq('id',eid):q.eq('cliente_id',cid);const e=await q;if(e.error)return alert(e.error.message);await db.from('max_innova_cotizaciones').update({asesor_id:aid}).eq('cliente_id',cid);closeModal();view('asignaciones')}
async function fillAdvisors(id){const r=await db.from('max_innova_usuarios').select('id,nombre,rol').eq('activo',true).in('rol',['ASESOR','ADMIN']).order('nombre');const el=$(id);if(el&&!r.error)el.innerHTML+=(r.data||[]).map(a=>`<option value="${a.id}">${esc(a.nombre)} · ${a.rol}</option>`).join('')}
async function payments(){setHead('Pagos y recibos','Validación y captura administrativa');const r=await safe('max_innova_pagos','*',{order:'created_at',limit:500});if(r.error)return err(r.error);content.innerHTML=`<div class="section-title"><h2>PAGOS</h2><div class="toolbar"><button class="btn" onclick="newPayment()">+ REGISTRAR PAGO</button></div></div>${tableHtml(r.data,['folio','monto','fecha_pago','concepto_pago','referencia','estatus'],x=>`${String(x.estatus).includes('PENDIENTE')?`<button class="btn" onclick="applyPayment('${x.id}')">APLICAR</button> <button class="btn bad" onclick="rejectPayment('${x.id}')">RECHAZAR</button>`:''}`)}`}
function newPayment(){openModal('REGISTRAR PAGO',`<div class="card"><div class="formgrid"><div class="field"><label>FOLIO *</label><input id="npFolio"></div><div class="field"><label>MONTO *</label><input id="npAmount" type="number" step="0.01"></div><div class="field"><label>FECHA</label><input id="npDate" type="date"></div><div class="field"><label>CONCEPTO</label><input id="npConcept" value="MENSUALIDAD"></div><div class="field"><label>REFERENCIA</label><input id="npRef"></div><div class="field full"><label>NOTAS</label><textarea id="npNotes"></textarea></div></div><button class="btn" onclick="saveNewPayment()">REGISTRAR PAGO</button></div>`)}
async function saveNewPayment(){if(!npFolio.value.trim()||Number(npAmount.value)<=0)return alert('Capture folio y monto.');const row={folio:npFolio.value.trim().toUpperCase(),monto:Number(npAmount.value),fecha_pago:npDate.value||new Date().toISOString(),concepto_pago:npConcept.value.trim()||'PAGO',referencia:npRef.value.trim()||null,notas:npNotes.value.trim()||null,estatus:'PAGO APLICADO'};const r=await db.from('max_innova_pagos').insert(row);if(r.error)return alert(r.error.message);await audit(row.folio,'PAGO REGISTRADO',row.concepto_pago+' · '+money(row.monto));closeModal();payments()}
async function applyPayment(id){if(!confirm('¿Confirmar que este pago fue validado?'))return;const u=(await db.auth.getUser()).data.user;const r=await db.from('max_innova_pagos').update({estatus:'PAGO APLICADO',validado_por:u.id,validado_en:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);payments()}
async function rejectPayment(id){if(!confirm('¿Marcar como rechazado / requiere aclaración?'))return;const r=await db.from('max_innova_pagos').update({estatus:'RECHAZADO / REQUIERE ACLARACIÓN'}).eq('id',id);if(r.error)return alert(r.error.message);payments()}
async function documents(){setHead('Documentos','Carga y consulta de documentación privada');const [r,c]=await Promise.all([safe('max_innova_documentos_asesor','*',{order:'created_at',limit:500}),db.from('max_innova_clientes_asesor').select('id,nombre,folio_cliente,max_innova_expedientes_asesor(id,asesor_id)').order('nombre')]);if(r.error)return err(r.error);window._docClients=c.data||[];content.innerHTML=`<div class="section-title"><h2>DOCUMENTOS</h2><div class="toolbar"><button class="btn" onclick="uploadDocumentModal()">+ SUBIR DOCUMENTO</button></div></div><p class="muted">Repositorio privado · PDF/JPG/PNG/WEBP · máximo 15 MB.</p>${tableHtml(r.data,['categoria','nombre_archivo','mime_type','tamano','created_at'])}`}
function uploadDocumentModal(){const opts=(window._docClients||[]).map(c=>{const ex=Array.isArray(c.max_innova_expedientes_asesor)?c.max_innova_expedientes_asesor[0]:c.max_innova_expedientes_asesor;return ex?`<option value="${ex.id}" data-a="${ex.asesor_id}">${esc(c.nombre)} · ${esc(c.folio_cliente||'SIN FOLIO')}</option>`:''}).join('');openModal('SUBIR DOCUMENTO',`<div class="card"><div class="field"><label>CLIENTE / EXPEDIENTE</label><select id="udExp">${opts}</select></div><div class="field"><label>CATEGORÍA</label><select id="udCat"><option>IDENTIFICACIÓN</option><option>DOMICILIO</option><option>INGRESOS</option><option>RFC / CONSTANCIA FISCAL</option><option>CURP</option><option>CONTRATO</option><option>OTRO</option></select></div><div class="field"><label>ARCHIVO</label><input id="udFile" type="file" accept="application/pdf,image/jpeg,image/png,image/webp"></div><button class="btn" onclick="saveDocumentUpload()">SUBIR AL EXPEDIENTE</button><div id="udMsg" class="msg"></div></div>`)}
async function saveDocumentUpload(){const f=udFile.files?.[0];if(!udExp.value||!f){udMsg.textContent='Seleccione expediente y archivo.';return}if(f.size>15*1024*1024){udMsg.textContent='El archivo supera 15 MB.';return}const u=(await db.auth.getUser()).data.user;if(!u){udMsg.textContent='Sesión no válida.';return}udMsg.textContent='Subiendo…';const clean=f.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]/g,'_');const path=`${u.id}/${udExp.value}/${Date.now()}_${clean}`;const up=await db.storage.from('max-innova-expedientes').upload(path,f,{upsert:false,contentType:f.type||'application/octet-stream'});if(up.error){udMsg.textContent=up.error.message;return}const opt=udExp.options[udExp.selectedIndex],advisor=opt?.dataset?.a||u.id;const ins=await db.from('max_innova_documentos_asesor').insert({expediente_id:udExp.value,asesor_id:advisor,categoria:udCat.value,nombre_archivo:f.name,storage_path:path,mime_type:f.type||null,tamano:f.size});if(ins.error){await db.storage.from('max-innova-expedientes').remove([path]);udMsg.textContent=ins.error.message;return}udMsg.style.color='#1c6b50';udMsg.textContent='Documento guardado correctamente.';setTimeout(()=>{closeModal();documents()},700)}

async function completeTask(id){const r=await db.from('max_innova_tareas_asesor').update({estatus:'COMPLETADA',completed_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);tasks()}
async function accountStatements(){setHead('Estados de cuenta','Creación y publicación administrativa');const r=await safe('max_innova_estados_cuenta','*',{order:'creado_en',limit:500});if(r.error)return err(r.error);content.innerHTML=`<div class="section-title"><h2>ESTADOS DE CUENTA</h2><div class="toolbar"><button class="btn" onclick="newStatement()">+ NUEVO ESTADO</button></div></div>${tableHtml(r.data,['folio','periodo_hasta','saldo_actual','mensualidad','proximo_vencimiento','publicado','creado_en'])}`}
function newStatement(){openModal('NUEVO ESTADO DE CUENTA',`<div class="card"><div class="formgrid"><div class="field"><label>FOLIO *</label><input id="nsFolio"></div><div class="field"><label>PERIODO HASTA *</label><input id="nsPeriod" type="date"></div><div class="field"><label>SALDO ACTUAL</label><input id="nsBalance" type="number" step="0.01"></div><div class="field"><label>MENSUALIDAD</label><input id="nsMonthly" type="number" step="0.01"></div><div class="field"><label>PRÓXIMO VENCIMIENTO</label><input id="nsDue" type="date"></div><div class="field"><label>PUBLICAR AL CLIENTE</label><select id="nsPublished"><option value="false">NO</option><option value="true">SÍ</option></select></div><div class="field full"><label>OBSERVACIONES</label><textarea id="nsNotes"></textarea></div></div><button class="btn" onclick="saveStatement()">GUARDAR ESTADO</button></div>`)}
async function saveStatement(){if(!nsFolio.value.trim()||!nsPeriod.value)return alert('Folio y periodo son obligatorios.');const u=(await db.auth.getUser()).data.user;const row={folio:nsFolio.value.trim().toUpperCase(),periodo_hasta:nsPeriod.value,saldo_actual:Number(nsBalance.value||0),mensualidad:Number(nsMonthly.value||0),proximo_vencimiento:nsDue.value||null,observaciones:nsNotes.value.trim()||null,publicado:nsPublished.value==='true',creado_por:u?.id||null};const r=await db.from('max_innova_estados_cuenta').insert(row);if(r.error)return alert(r.error.message);await audit(row.folio,'ESTADO DE CUENTA CREADO','Publicado: '+row.publicado);closeModal();accountStatements()}
async function users(){setHead('Asesores y usuarios','Control interno de accesos, nombres y roles');const r=await db.from('max_innova_usuarios').select('*').order('created_at',{ascending:false});if(r.error)return err(r.error);window._users=r.data||[];content.innerHTML=`<div class="section-title"><h2>USUARIOS</h2><div class="toolbar"><button class="btn" onclick="newInternalUser()">+ REGISTRAR PERFIL INTERNO</button></div></div><div class="card"><p><b>USUARIO</b> es el alias de acceso. <b>NOMBRE COMPLETO</b> es independiente y es el que se usa en documentos y cotizaciones.</p><p class="muted">Por seguridad, este HTML no contiene la llave secreta de Supabase. La credencial Auth debe existir antes de vincular el perfil.</p></div>${tableHtml(r.data,['usuario','nombre','telefono','rol','activo','created_at'],x=>`<button class="btn alt" onclick="editUserFull('${x.id}')">EDITAR</button>`)}`}
function newInternalUser(){openModal('REGISTRAR PERFIL INTERNO',`<div class="card"><div class="formgrid"><div class="field"><label>UID DE AUTH *</label><input id="nuId" placeholder="UID creado en Authentication"></div><div class="field"><label>USUARIO / ALIAS *</label><input id="nuUser" placeholder="ASESORCARLOS"></div><div class="field full"><label>NOMBRE COMPLETO *</label><input id="nuName"></div><div class="field"><label>TELÉFONO</label><input id="nuPhone"></div><div class="field"><label>ROL</label><select id="nuRole"><option>ASESOR</option><option>ADMIN</option></select></div><div class="field"><label>ACTIVO</label><select id="nuActive"><option value="true">SÍ</option><option value="false">NO</option></select></div></div><button class="btn" onclick="saveInternalUser()">GUARDAR PERFIL</button></div>`)}
async function saveInternalUser(){const id=nuId.value.trim(),usuario=nuUser.value.trim().toUpperCase().replace(/\s+/g,''),nombre=nuName.value.trim();if(!id||!usuario||!nombre)return alert('UID, usuario y nombre son obligatorios.');const r=await db.from('max_innova_usuarios').insert({id,usuario,nombre,telefono:nuPhone.value.trim()||null,rol:nuRole.value,activo:nuActive.value==='true'});if(r.error)return alert(r.error.message);await audit(null,'USUARIO REGISTRADO',usuario+' · '+nuRole.value);closeModal();users()}
function editUserFull(id){const x=(window._users||[]).find(u=>u.id===id);if(!x)return;openModal('EDITAR USUARIO',`<div class="card"><div class="formgrid"><div class="field"><label>USUARIO / ALIAS</label><input id="euUser" value="${esc(x.usuario||'')}"></div><div class="field"><label>NOMBRE COMPLETO</label><input id="euName" value="${esc(x.nombre||'')}"></div><div class="field"><label>TELÉFONO</label><input id="euPhone" value="${esc(x.telefono||'')}"></div><div class="field"><label>ROL</label><select id="euRole"><option ${x.rol==='ASESOR'?'selected':''}>ASESOR</option><option ${x.rol==='ADMIN'?'selected':''}>ADMIN</option></select></div><div class="field"><label>ACCESO</label><select id="euActive"><option value="true" ${x.activo?'selected':''}>ACTIVO</option><option value="false" ${!x.activo?'selected':''}>INACTIVO</option></select></div></div><button class="btn" onclick="saveUserFull('${id}')">GUARDAR CAMBIOS</button></div>`)}
async function saveUserFull(id){const row={usuario:euUser.value.trim().toUpperCase().replace(/\s+/g,''),nombre:euName.value.trim(),telefono:euPhone.value.trim()||null,rol:euRole.value,activo:euActive.value==='true',updated_at:new Date().toISOString()};const r=await db.from('max_innova_usuarios').update(row).eq('id',id);if(r.error)return alert(r.error.message);await audit(null,'USUARIO ACTUALIZADO',row.usuario+' · '+row.rol);closeModal();users()}
async function reports(){setHead('Reportes','Resumen operativo');const [cl,qt,op,pa,us,ta]=await Promise.all(['max_innova_clientes_asesor','max_innova_cotizaciones','max_innova_operaciones','max_innova_pagos','max_innova_usuarios','max_innova_tareas_asesor'].map(count));content.innerHTML=`<div class="hero"><small>REPORTE GENERAL</small><h2>Indicadores operativos</h2><p>Conteos actuales de los módulos conectados a Supabase.</p></div><div class="kpis"><div class="kpi"><b>${cl}</b><span>CLIENTES</span></div><div class="kpi"><b>${qt}</b><span>COTIZACIONES</span></div><div class="kpi"><b>${op}</b><span>OPERACIONES</span></div><div class="kpi"><b>${pa}</b><span>PAGOS</span></div><div class="kpi"><b>${us}</b><span>USUARIOS</span></div></div><div class="card"><h3>SEGUIMIENTOS</h3><p><b>${ta}</b> tareas registradas.</p><p class="muted">Los importes y saldos se consultan desde los registros reales; este panel no calcula ni inventa saldos administrativos.</p></div>`}
function openModal(t,h){modalTitle.textContent=t;modalBody.innerHTML=h;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}
boot();
</script></body></html>
